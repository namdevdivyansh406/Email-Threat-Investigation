{% extends 'base.html' %}

{% block content %}
  <section class="panel upload-panel">
    <div class="panel-header">
      <h2>Analyze an Email</h2>
      <p>Drop in an .eml sample to uncover suspicious behavior and generate a report.</p>
    </div>
    <form action="{{ url_for('main.index') }}" method="post" enctype="multipart/form-data">
      <label for="email_file">Choose an .eml file</label>
      <input type="file" id="email_file" name="email_file" accept=".eml" required>
      <button type="submit">Analyze Email</button>
    </form>
  </section>
{% endblock %}
